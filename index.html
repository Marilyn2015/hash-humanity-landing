  <style>
    :root {
      --bg: #000;
      --text: #f5f5f7;
      --muted: #9b9ba1;
      --dim: #6e6e73;
      --line: rgba(255,255,255,.09);
      --line-strong: rgba(255,255,255,.16);
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #000;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--text);

      background:
        radial-gradient(
          circle at 52% -6%,
          rgba(255,255,255,.075),
          transparent 25%
        ),
        #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      width: min(calc(100% - 40px), var(--max));
      margin-inline: auto;
    }

    /* HEADER */

    .site-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;
      padding-top: env(safe-area-inset-top);
      background: rgba(0,0,0,.76);
      border-bottom: 1px solid rgba(255,255,255,.055);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }

    .header-inner {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      object-fit: contain;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      filter: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-link {
      padding: 8px 10px;
      color: #cdcdd1;
      font-size: 13px;
      font-weight: 550;
    }

    .lang-switch {
      position: relative;
    }

    .lang-btn {
      padding: 8px 7px;
      border: 0;
      background: transparent;
      color: #d4d4d8;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .lang-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      display: none;
      min-width: 155px;
      margin: 0;
      padding: 8px;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(18,18,20,.98);
      box-shadow: 0 24px 60px rgba(0,0,0,.65);
      z-index: 1200;
    }

    .join-btn,
    .enter-btn {
      min-height: 35px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 650;
    }

    .join-btn {
      border: 1px solid rgba(255,255,255,.17);
      background: rgba(255,255,255,.055);
      color: #fff;
    }

    .enter-btn {
      border: 1px solid #fff;
      background: #fff;
      color: #000;
    }

    /* HERO */

    main {
      padding-top: 110px;
    }

    .hero {
      min-height: 680px;
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(420px, .95fr);
      align-items: center;
      gap: 54px;
      padding: 48px 0 76px;
    }

    .hero-copy {
      position: relative;
      z-index: 4;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 19px;
      color: #98989d;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 18px rgba(255,255,255,.78);
    }

    .hero h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(70px, 8vw, 112px);
      line-height: .88;
      letter-spacing: -.07em;
      font-weight: 680;
    }

    .hero h1 em {
      display: block;
      color: #77777c;
      font-style: normal;
      font-weight: 560;
    }

    .lead {
      max-width: 620px;
      margin: 27px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 1.65vw, 21px);
      line-height: 1.52;
      letter-spacing: -.02em;
    }

    .lead strong {
      color: #f4f4f6;
      font-weight: 600;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .primary-btn,
    .secondary-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 650;
    }

    .primary-btn {
      border: 1px solid #fff;
      background: #fff;
      color: #000;
    }

    .secondary-btn {
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.035);
      color: #f4f4f6;
    }

    /* PHONE ART */

    .visual {
      position: relative;
      min-width: 0;
    }

    .phone-stage {
      position: relative;
      width: min(610px, 46vw);
      max-width: 100%;
      aspect-ratio: 1 / .92;
      margin-inline: auto;
    }

    .phone-glow {
      position: absolute;
      width: 68%;
      height: 58%;
      left: 16%;
      bottom: 4%;
      border-radius: 50%;
      background: rgba(255,255,255,.075);
      filter: blur(68px);
      transform: scaleX(1.12);
      pointer-events: none;
    }

    .phone {
      position: absolute;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 44px;
      box-shadow:
        0 40px 90px rgba(0,0,0,.72),
        inset 0 0 0 1px rgba(255,255,255,.025);
      transform-style: preserve-3d;
    }

    .phone-back {
      width: 42%;
      aspect-ratio: .50;
      left: 4%;
      top: 28%;
      z-index: 1;

      background:
        linear-gradient(
          145deg,
          #38383c 0%,
          #202023 36%,
          #111113 100%
        );

      transform:
        rotateZ(-18deg)
        rotateY(12deg);
    }

    .phone-front {
      width: 44%;
      aspect-ratio: .50;
      right: 4%;
      top: 5%;
      z-index: 3;
      background: #050506;

      transform:
        rotateZ(7deg)
        rotateY(-9deg);
    }

    .phone-shadow {
      position: absolute;
      z-index: 2;
      width: 33%;
      height: 64%;
      left: 36%;
      top: 21%;
      border-radius: 50%;
      background: rgba(0,0,0,.68);
      filter: blur(25px);
      transform: rotate(-7deg);
      pointer-events: none;
    }

    .camera-island {
      position: absolute;
      width: 92px;
      height: 92px;
      top: 22px;
      left: 20px;
      border-radius: 26px;

      background:
        linear-gradient(
          145deg,
          #4a4a4e,
          #242427
        );

      border: 1px solid rgba(255,255,255,.13);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 10px 22px rgba(0,0,0,.30);
    }

    .lens {
      position: absolute;
      width: 29px;
      height: 29px;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 42% 38%,
          #34343b 0 11%,
          #111117 25%,
          #020204 67%,
          #17171d 74%,
          #000 100%
        );

      border: 1px solid rgba(255,255,255,.12);

      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.025);
    }

    .lens.one {
      left: 12px;
      top: 11px;
    }

    .lens.two {
      right: 11px;
      top: 26px;
    }

    .lens.three {
      left: 15px;
      bottom: 10px;
    }

    .phone-back-logo {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 46px;
      height: 46px;
      transform: translate(-50%, -50%);
      object-fit: contain;
      opacity: .62;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      filter: none;
      z-index: 2;
    }

    .phone-screen {
      position: absolute;
      inset: 7px;
      overflow: hidden;
      border-radius: 37px;
      background: #000;
    }

    .phone-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .phone-topbar {
      position: absolute;
      top: 13px;
      left: 50%;
      width: 34%;
      height: 17px;
      transform: translateX(-50%);
      border-radius: 11px;
      background: #050506;
      z-index: 4;
    }

    .reflection {
      position: absolute;
      left: 9%;
      right: 4%;
      bottom: 1%;
      height: 16%;
      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255,255,255,.10),
          transparent 65%
        );

      filter: blur(15px);
      opacity: .55;
    }

    /* PRINCIPLES */

    .principles {
      padding: 92px 0 100px;
      border-top: 1px solid var(--line);
    }

    .section-label {
      margin-bottom: 17px;
      color: #76767b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .section-title {
      max-width: 770px;
      margin: 0;
      font-size: clamp(40px, 5vw, 66px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 650;
    }

    .section-text {
      max-width: 690px;
      margin: 21px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.58;
      letter-spacing: -.015em;
    }

    .principle-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      margin-top: 52px;
      background: var(--line);
    }

    .principle {
      min-height: 185px;
      padding: 25px;
      background: #000;
    }

    .principle-number {
      display: block;
      margin-bottom: 40px;
      color: #69696e;
      font-size: 11px;
      font-weight: 650;
    }

    .principle h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 620;
      letter-spacing: -.025em;
    }

    .principle p {
      margin: 10px 0 0;
      color: #85858a;
      font-size: 13px;
      line-height: 1.52;
    }

    /* STATEMENT */

    .statement {
      padding: 102px 0 110px;
      border-top: 1px solid var(--line);
    }

    /* HUMANKEY */

    .humankey-section {
      padding: 100px 0;
      border-top: 1px solid var(--line);
    }

    .humankey-grid {
      display: grid;

      grid-template-columns:
        minmax(0, .65fr)
        minmax(0, 1fr);

      gap: 70px;
      align-items: start;
    }

    .hk-mark {
      position: relative;
      width: 180px;
      height: 180px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;

      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,.09),
          rgba(255,255,255,.015) 62%,
          transparent 70%
        );
    }

    .hk-mark::before,
    .hk-mark::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.09);
    }

    .hk-mark::before {
      inset: 24px;
    }

    .hk-mark::after {
      inset: 50px;
    }

    .hk-mark img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: none;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      margin-top: 24px;
      color: #f5f5f7;
      font-size: 13px;
      font-weight: 620;
    }

    /* JOIN */

    .join-section {
      padding: 98px 0 106px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .join-section .section-title {
      max-width: 720px;
      margin-inline: auto;
    }

    .join-section .section-text {
      max-width: 620px;
      margin-inline: auto;
    }

    .join-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 29px;
    }

    /* FOOTER */

    .site-footer {
      padding:
        23px 0
        calc(23px + env(safe-area-inset-bottom));

      border-top: 1px solid var(--line);
      color: #77777c;
      font-size: 12px;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .footer-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .footer-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      filter: none;
    }

    /* DESKTOP ANIMATION */

    @media
      (min-width: 821px)
      and (prefers-reduced-motion: no-preference) {

      .phone-back {
        animation: floatBack 7s ease-in-out infinite;
      }

      .phone-front {
        animation: floatFront 6s ease-in-out infinite;
      }

      @keyframes floatBack {
        0%,
        100% {
          transform:
            translateY(0)
            rotateZ(-18deg)
            rotateY(12deg);
        }

        50% {
          transform:
            translateY(-8px)
            rotateZ(-18deg)
            rotateY(12deg);
        }
      }

      @keyframes floatFront {
        0%,
        100% {
          transform:
            translateY(0)
            rotateZ(7deg)
            rotateY(-9deg);
        }

        50% {
          transform:
            translateY(-11px)
            rotateZ(7deg)
            rotateY(-9deg);
        }
      }
    }

    /* MOBILE */

    @media (max-width: 820px) {

      .wrap {
        width: calc(100% - 24px);
      }

      .header-inner {
        height: 56px;
      }

      .brand {
        gap: 7px;
        font-size: 13px;
      }

      .brand-logo {
        width: 27px;
        height: 27px;
      }

      .header-link {
        display: none;
      }

      .join-btn,
      .enter-btn {
        min-height: 32px;
        padding: 0 10px;
        font-size: 11px;
      }

      main {
        padding-top: 80px;
      }

      .hero {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 45px 0 58px;
        text-align: center;
      }

      .hero-copy {
        z-index: 5;
      }

      .eyebrow {
        margin-bottom: 14px;
        font-size: 9px;
      }

      .hero h1 {
        max-width: 560px;
        margin-inline: auto;
        font-size: clamp(60px, 16vw, 82px);
      }

      .lead {
        max-width: 390px;
        margin: 20px auto 0;
        font-size: 15px;
      }

      .hero-actions {
        justify-content: center;
        margin-top: 24px;
      }

      .phone-stage {
        width: min(500px, 100%);
        aspect-ratio: 1 / .93;
      }

      .phone-back {
        width: 43%;
        left: 2%;
        top: 30%;
        transform:
          rotateZ(-18deg)
          rotateY(0);
      }

      .phone-front {
        width: 45%;
        right: 2%;
        top: 4%;
        transform:
          rotateZ(7deg)
          rotateY(0);
      }

      .camera-island {
        width: 67px;
        height: 67px;
        top: 16px;
        left: 14px;
        border-radius: 19px;
      }

      .lens {
        width: 21px;
        height: 21px;
      }

      .lens.one {
        left: 8px;
        top: 8px;
      }

      .lens.two {
        right: 8px;
        top: 19px;
      }

      .lens.three {
        left: 10px;
        bottom: 7px;
      }

      .phone {
        border-radius: 32px;
      }

      .phone-screen {
        inset: 5px;
        border-radius: 27px;
      }

      .phone-topbar {
        top: 9px;
        height: 13px;
      }

      .principles,
      .statement,
      .humankey-section,
      .join-section {
        padding: 66px 0;
      }

      .section-title {
        font-size: clamp(39px, 11vw, 55px);
      }

      .section-text {
        font-size: 15px;
      }

      .principle-grid {
        grid-template-columns: 1fr 1fr;
        margin-top: 38px;
      }

      .principle {
        min-height: 160px;
        padding: 20px;
      }

      .principle-number {
        margin-bottom: 29px;
      }

      .humankey-grid {
        grid-template-columns: 1fr;
        gap: 36px;
        text-align: center;
      }

      .hk-mark {
        width: 145px;
        height: 145px;
        margin-inline: auto;
      }

      .text-link {
        justify-content: center;
      }

      .footer-inner {
        justify-content: center;
        text-align: center;
      }

      .footer-logo {
        width: 20px;
        height: 20px;
      }
    }

    @media (max-width: 520px) {

      .header-actions {
        gap: 3px;
      }

      .enter-btn {
        display: none;
      }

      .hero {
        padding-top: 35px;
      }

      .hero h1 {
        font-size: clamp(55px, 17vw, 72px);
      }

      .phone-stage {
        width: 100%;
      }

      .principle-grid {
        grid-template-columns: 1fr;
      }

      .principle {
        min-height: auto;
      }

      .primary-btn,
      .secondary-btn {
        width: 100%;
      }
    }

    @media (max-width: 430px) {

      .wrap {
        width: calc(100% - 18px);
      }

      .header-inner {
        height: 54px;
      }

      .brand {
        font-size: 12px;
      }

      .brand-logo {
        width: 25px;
        height: 25px;
      }

      main {
        padding-top: 72px;
      }

      .hero {
        padding-top
