<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="format-detection" content="telephone=no" />

  <title>Hash Humanity | Real is rare.</title>

  <meta
    name="description"
    content="Hash Humanity is human-first social media protected by HumanKey. Real people, real conversation, and a network designed to make bot networks and duplicate identities dramatically harder to scale."
  />

  <meta name="theme-color" content="#000000" />

  <meta
    name="robots"
    content="index,follow,max-image-preview:large"
  />

  <link rel="icon" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />

  <link
    rel="preload"
    href="app-preview.png"
    as="image"
  />

  <style>
    :root {
      --bg: #000;
      --text: #f5f5f7;
      --muted: #9b9ba1;
      --dim: #6e6e73;
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(255,255,255,.18);
      --surface: rgba(255,255,255,.035);
      --max: 1240px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #000;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-width: 320px;
      width: 100%;
      overflow-x: hidden;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% -8%,
          rgba(255,255,255,.065),
          transparent 24%
        ),
        #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      width: min(calc(100% - 40px), var(--max));
      margin-inline: auto;
    }


    /* LOGO */

    .logo-mark {
      display: inline-block;
      flex: 0 0 auto;

      width: 27px;
      height: 27px;

      background: #fff;

      -webkit-mask-image: url("logo.png");
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;

      mask-image: url("logo.png");
      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;
    }

    .footer-logo-mark {
      width: 21px;
      height: 21px;
    }

    .phone-logo-mark {
      position: absolute;

      left: 50%;
      top: 53%;

      width: 38px;
      height: 38px;

      transform: translate(-50%, -50%);

      opacity: .55;

      z-index: 2;
    }


    /* HEADER */

    .site-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;

      padding-top: env(safe-area-inset-top);

      background: rgba(0,0,0,.76);

      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);

      border-bottom: 1px solid rgba(255,255,255,.055);
    }

    .header-inner {
      height: 62px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;

      gap: 9px;

      min-width: 0;

      font-size: 15px;
      font-weight: 650;

      letter-spacing: -.02em;

      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;

      gap: 7px;
    }

    .lang-switch {
      position: relative;
    }

    .lang-btn {
      border: 0;
      background: transparent;

      color: #d4d4d8;

      font: inherit;
      font-size: 12px;
      font-weight: 650;

      padding: 8px 7px;

      cursor: pointer;
    }

    .lang-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;

      min-width: 155px;

      margin: 0;
      padding: 8px;

      display: none;

      list-style: none;

      border: 1px solid var(--line);
      border-radius: 12px;

      background: rgba(18,18,20,.97);

      box-shadow: 0 24px 60px rgba(0,0,0,.65);

      z-index: 1200;
    }

    .header-link {
      padding: 8px 10px;

      color: #d1d1d5;

      font-size: 13px;
      font-weight: 550;
    }

    .header-enter {
      min-height: 35px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 14px;

      border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px;

      background: rgba(255,255,255,.055);

      color: #fff;

      font-size: 12px;
      font-weight: 650;
    }


    /* HERO */

    .hero {
      min-height: 100svh;

      padding-top: 112px;
      padding-bottom: 34px;

      display: grid;

      grid-template-columns: 1.05fr .95fr;

      align-items: center;

      gap: 34px;
    }

    .hero-copy {
      position: relative;
      z-index: 3;

      max-width: 680px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;

      gap: 8px;

      margin-bottom: 18px;

      color: #98989d;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: .16em;

      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #fff;

      box-shadow: 0 0 16px rgba(255,255,255,.75);
    }

    .hero h1 {
      margin: 0;

      max-width: 680px;

      font-size: clamp(64px, 8vw, 112px);

      line-height: .9;

      letter-spacing: -.07em;

      font-weight: 680;
    }

    .hero h1 em {
      color: #79797e;

      font-style: normal;
      font-weight: 560;
    }

    .lead {
      max-width: 600px;

      margin: 24px 0 0;

      color: var(--muted);

      font-size: clamp(17px, 1.45vw, 21px);

      line-height: 1.52;

      letter-spacing: -.02em;
    }

    .lead strong {
      color: #f0f0f2;
      font-weight: 600;
    }

    .hero-actions {
      display: flex;
      align-items: center;

      gap: 9px;

      margin-top: 24px;
    }

    .primary-cta,
    .mission-cta {
      min-height: 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 18px;

      border-radius: 8px;

      font-size: 13px;
      font-weight: 650;

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
    }

    .primary-cta {
      border: 1px solid #fff;

      background: #fff;

      color: #000;
    }

    .mission-cta {
      border: 1px solid rgba(255,255,255,.16);

      background: rgba(255,255,255,.025);

      color: #f2f2f4;
    }

    .primary-cta:hover,
    .mission-cta:hover {
      transform: translateY(-1px);
    }

    .mission-cta:hover {
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.05);
    }


    /* PHONE ART */

    .phone-stage {
      position: relative;

      width: min(570px, 43vw);

      max-width: 100%;

      aspect-ratio: 1 / 1.02;

      margin-inline: auto;

      perspective: 1200px;

      contain: layout paint;
    }

    .phone {
      position: absolute;

      overflow: hidden;

      border: 1px solid rgba(255,255,255,.16);

      border-radius: 34px;

      background:
        linear-gradient(
          145deg,
          #202024,
          #080809 55%,
          #161619
        );

      box-shadow:
        0 55px 100px rgba(0,0,0,.75),
        inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .phone::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,.08),
          transparent 19%,
          transparent 78%,
          rgba(255,255,255,.025)
        );
    }

    .phone-back {
      width: 40%;

      left: 18%;
      top: 34%;

      aspect-ratio: .49 / 1;

      transform:
        rotateZ(-21deg)
        rotateY(10deg);

      z-index: 1;
    }

    .camera-island {
      position: absolute;

      width: 78px;
      height: 78px;

      left: 14px;
      top: 14px;

      border: 1px solid rgba(255,255,255,.14);

      border-radius: 23px;

      background:
        linear-gradient(
          145deg,
          #242428,
          #111114
        );

      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.6);
    }

    .camera {
      position: absolute;

      width: 23px;
      height: 23px;

      border-radius: 50%;

      border: 2px solid rgba(255,255,255,.12);

      background:
        radial-gradient(
          circle at 40% 35%,
          #404047,
          #09090b 45%,
          #000 70%
        );

      box-shadow:
        inset 0 0 6px rgba(255,255,255,.08);
    }

    .camera.one {
      left: 10px;
      top: 9px;
    }

    .camera.two {
      right: 10px;
      top: 22px;
    }

    .camera.three {
      left: 16px;
      bottom: 8px;
    }

    .phone-front {
      width: 43%;

      right: 13%;
      top: 14%;

      aspect-ratio: .49 / 1;

      transform:
        rotateZ(8deg)
        rotateY(-7deg);

      z-index: 2;

      background: #070708;
    }

    .phone-screen {
      position: absolute;

      inset: 7px;

      overflow: hidden;

      border-radius: 27px;

      background: #000;
    }

    .phone-screen img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;
    }

    .phone-notch {
      position: absolute;

      top: 13px;
      left: 50%;

      width: 38%;
      height: 18px;

      transform: translateX(-50%);

      border-radius: 20px;

      background: #020202;

      z-index: 4;
    }

    .phone-glow {
      position: absolute;

      width: 70%;
      height: 20%;

      left: 18%;
      bottom: 5%;

      border-radius: 50%;

      background: rgba(255,255,255,.08);

      filter: blur(48px);

      opacity: .55;
    }


    /* PRINCIPLES */

    .principles {
      min-height: 58px;

      display: flex;
      align-items: center;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .principles-inner {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 0;
    }

    .principle {
      padding: 17px 18px;

      text-align: center;

      color: #8e8e93;

      font-size: 11px;
      font-weight: 650;

      letter-spacing: .05em;

      text-transform: uppercase;

      border-right: 1px solid var(--line);
    }

    .principle:first-child {
      border-left: 1px solid var(--line);
    }


    /* STATEMENT */

    .statement {
      padding: 78px 0 70px;
    }

    .section-kicker {
      display: block;

      margin-bottom: 17px;

      color: #737378;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: .17em;

      text-transform: uppercase;
    }

    .statement h2 {
      max-width: 930px;

      margin: 0;

      font-size: clamp(48px, 6vw, 86px);

      line-height: .97;

      letter-spacing: -.058em;

      font-weight: 650;
    }

    .statement h2 em {
      color: #77777c;

      font-style: normal;
      font-weight: 560;
    }

    .statement p {
      max-width: 710px;

      margin: 24px 0 0;

      color: var(--muted);

      font-size: 17px;

      line-height: 1.6;
    }


    /* HUMANKEY */

    .humankey {
      padding: 68px 0 74px;

      border-top: 1px solid var(--line);
    }

    .humankey-grid {
      display: grid;

      grid-template-columns: .9fr 1.1fr;

      gap: 60px;

      align-items: start;
    }

    .humankey h2 {
      max-width: 680px;

      margin: 15px 0 0;

      font-size: clamp(45px, 5.4vw, 74px);

      line-height: .98;

      letter-spacing: -.057em;

      font-weight: 650;
    }

    .humankey h2 em {
      color: #78787d;

      font-style: normal;
    }

    .humankey-copy {
      padding-top: 31px;
    }

    .humankey-copy p {
      max-width: 610px;

      margin: 0;

      color: var(--muted);

      font-size: 17px;

      line-height: 1.6;
    }

    .text-link {
      display: inline-flex;

      margin-top: 22px;

      padding-bottom: 4px;

      border-bottom: 1px solid rgba(255,255,255,.24);

      color: #f2f2f4;

      font-size: 13px;
      font-weight: 650;
    }


    /* JOIN */

    .join {
      padding: 0 0 72px;
    }

    .join-panel {
      padding: 48px 34px;

      border: 1px solid rgba(255,255,255,.10);

      border-radius: 18px;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(255,255,255,.075),
          transparent 46%
        ),
        rgba(255,255,255,.02);

      text-align: center;
    }

    .join-panel h2 {
      margin: 13px auto 0;

      max-width: 760px;

      font-size: clamp(50px, 6vw, 85px);

      line-height: .92;

      letter-spacing: -.064em;

      font-weight: 650;
    }

    .join-panel h2 em {
      color: #79797e;

      font-style: normal;
    }

    .join-panel p {
      max-width: 600px;

      margin: 22px auto 0;

      color: var(--muted);

      font-size: 16px;

      line-height: 1.55;
    }

    .join-actions {
      margin-top: 24px;

      display: flex;
      justify-content: center;

      gap: 9px;

      flex-wrap: wrap;
    }


    /* FOOTER */

    .site-footer {
      padding:
        22px 0
        calc(22px + env(safe-area-inset-bottom));

      border-top: 1px solid var(--line);

      color: #77777c;

      font-size: 12px;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      flex-wrap: wrap;
    }

    .footer-brand {
      display: inline-flex;
      align-items: center;

      gap: 8px;
    }


    /* DESKTOP PHONE ANIMATION ONLY */

    @media
      (min-width: 821px)
      and (prefers-reduced-motion: no-preference) {

      .phone-front {
        animation:
          floatFront 7s
          ease-in-out
          infinite;
      }

      .phone-back {
        animation:
          floatBack 8s
          ease-in-out
          infinite;
      }

      @keyframes floatFront {
        0%,
        100% {
          transform:
            translateY(0)
            rotateZ(8deg)
            rotateY(-7deg);
        }

        50% {
          transform:
            translateY(-8px)
            rotateZ(8deg)
            rotateY(-7deg);
        }
      }

      @keyframes floatBack {
        0%,
        100% {
          transform:
            translateY(0)
            rotateZ(-21deg)
            rotateY(10deg);
        }

        50% {
          transform:
            translateY(7px)
            rotateZ(-21deg)
            rotateY(10deg);
        }
      }
    }


    /* TABLET / MOBILE */

    @media (max-width: 820px) {

      .wrap {
        width: calc(100% - 24px);
      }

      .header-inner {
        height: 56px;
      }

      .brand {
        gap: 7px;
        font-size: 13px;
      }

      .logo-mark {
        width: 25px;
        height: 25px;
      }

      .footer-logo-mark {
        width: 20px;
        height: 20px;
      }

      .phone-logo-mark {
        width: 31px;
        height: 31px;
      }

      .header-link {
        display: none;
      }

      .header-enter {
        min-height: 32px;

        padding: 0 11px;

        border-radius: 8px;

        font-size: 11px;
      }

      .hero {
        min-height: auto;

        display: block;

        padding-top: 84px;
        padding-bottom: 18px;

        text-align: center;
      }

      .hero-copy {
        width: 100%;
        max-width: 430px;

        margin-inline: auto;
      }

      .eyebrow {
        margin-bottom: 14px;
        font-size: 9px;
      }

      .hero h1 {
        max-width: 390px;

        margin-inline: auto;

        font-size: clamp(54px, 15vw, 72px);

        line-height: .91;
      }

      .lead {
        max-width: 355px;

        margin: 18px auto 0;

        font-size: 15px;

        line-height: 1.5;
      }

      .hero-actions {
        width: min(100%, 350px);

        margin: 22px auto 0;

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 8px;
      }

      .primary-cta,
      .mission-cta {
        width: 100%;

        min-height: 44px;

        padding: 0 12px;

        border-radius: 8px;

        font-size: 12px;
      }

      .phone-stage {
        width: min(390px, 92vw);

        max-width: 100%;

        aspect-ratio: 1 / .98;

        margin: 8px auto 0;

        perspective: none;
      }

      .phone {
        border-radius: 28px;
      }

      .phone-front {
        width: 45%;

        right: 12%;
        top: 10%;

        transform: rotateZ(5deg);

        animation: none !important;
      }

      .phone-back {
        width: 43%;

        left: 14%;
        top: 31%;

        transform: rotateZ(-15deg);

        animation: none !important;
      }

      .phone-screen {
        inset: 6px;

        border-radius: 22px;
      }

      .camera-island {
        width: 61px;
        height: 61px;

        left: 11px;
        top: 11px;

        border-radius: 18px;
      }

      .camera {
        width: 18px;
        height: 18px;
      }

      .principles {
        min-height: auto;
      }

      .principles-inner {
        grid-template-columns: repeat(2, 1fr);
      }

      .principle {
        padding: 12px 8px;

        font-size: 10px;

        border-bottom: 1px solid var(--line);
      }

      .principle:nth-child(2) {
        border-right: 0;
      }

      .principle:nth-child(3),
      .principle:nth-child(4) {
        border-bottom: 0;
      }

      .statement {
        padding: 52px 0 48px;
      }

      .statement h2 {
        font-size: clamp(42px, 11vw, 61px);
      }

      .statement p {
        margin-top: 19px;

        font-size: 15px;
      }

      .humankey {
        padding: 50px 0 54px;
      }

      .humankey-grid {
        grid-template-columns: 1fr;

        gap: 20px;
      }

      .humankey h2 {
        font-size: clamp(42px, 11vw, 60px);
      }

      .humankey-copy {
        padding-top: 0;
      }

      .humankey-copy p {
        font-size: 15px;
      }

      .join {
        padding-bottom: 50px;
      }

      .join-panel {
        padding: 34px 18px;

        border-radius: 14px;
      }

      .join-panel h2 {
        font-size: clamp(47px, 12vw, 64px);
      }

      .join-panel p {
        margin-top: 18px;

        font-size: 15px;
      }

      .footer-inner {
        justify-content: center;

        text-align: center;
      }
    }


    /* SMALL PHONES */

    @media (max-width: 430px) {

      .wrap {
        width: calc(100% - 18px);
      }

      .header-inner {
        height: 54px;
      }

      .brand {
        font-size: 12px;
      }

      .logo-mark {
        width: 24px;
        height: 24px;
      }

      .hero {
        padding-top: 78px;
        padding-bottom: 15px;
      }

      .hero h1 {
        max-width: 340px;

        font-size: clamp(50px, 15vw, 64px);
      }

      .lead {
        max-width: 320px;

        font-size: 14px;
      }

      .hero-actions {
        width: 100%;
        max-width: 320px;

        grid-template-columns: 1fr;
      }

      .primary-cta,
      .mission-cta {
        min-height: 43px;

        border-radius: 8px;
      }

      .phone-stage {
        width: min(355px, 91vw);

        margin-top: 5px;
      }

      .statement {
        padding: 46px 0 44px;
      }

      .humankey {
        padding: 46px 0 50px;
      }

      .join-panel {
        padding: 30px 16px;
      }
    }


    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>


<body>

  <header class="site-header">

    <div class="wrap header-inner">

      <a
        class="brand"
        href="index.html"
        aria-label="Hash Humanity home"
      >
